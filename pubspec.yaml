name: cyborg
description: Cyborg - Modular AGI Platform | Local-first AI OS
publish_to: 'none'
version: 17.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase (only what we actually use) ─────────────────────────────────
  # firebase_storage and cloud_firestore are REMOVED — they break Windows
  # C++ builds and are not used anywhere in this app.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # ── State Management ─────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── UI ───────────────────────────────────────────────────────────────────
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # ── Network ──────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # ── Local Storage ────────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  ffi: ^2.1.0                   # FFI bindings for Android LightRT native library

  # ── File Operations ──────────────────────────────────────────────────────
  file_picker: ^8.1.3
  mime: ^1.0.5

  # ── Markdown ─────────────────────────────────────────────────────────────
  flutter_markdown: ^0.7.3

  # ── Charts ───────────────────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── Utils ────────────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1

  # ── World Monitor (wm2 integration) ──────────────────────────────────────────
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.0
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  animated_text_kit: ^4.2.2
  provider: ^6.1.2
  vector_math: ^2.1.4
  webview_windows: ^0.4.0

  # ── MiroFish (simulation engine) ─────────────────────────────────────────────
  # ── MiroFish (simulation engine) ─────────────────────────────────────────────
  rxdart: ^0.27.7
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/geojson/
  # To enable JetBrainsMono font:
  # 1. Place JetBrainsMono-Regular.ttf and JetBrainsMono-Bold.ttf in assets/fonts/
  # 2. Uncomment the section below and in lib/core/theme/app_theme.dart
  # fonts:
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
